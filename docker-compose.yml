version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mansa-app
    ports:
      - "5678:5678"
    environment:
      - NODE_ENV=production
      - PORT=5678
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DB_SQLITE_DATABASE_FILE=/data/n8n.db
      - VUE_APP_GEMINI_API_KEY=${VUE_APP_GEMINI_API_KEY}
      - VUE_APP_ENABLE_AI_ASSISTANT=true
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-password}
      - N8N_PROTOCOL=http
      - N8N_HOST=localhost
      - N8N_LOG_LEVEL=info
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - mansa_data:/data
      - mansa_logs:/tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: mansa-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=n8n_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mansa_data:
  mansa_logs:
  postgres_data:

networks:
  default:
    name: mansa-network

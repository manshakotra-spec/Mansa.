version: '3.8'

services:
  n8n:
    image: n8n:latest
    container_name: n8n-mansa
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=sqlite
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-password}
      - VUE_APP_GEMINI_API_KEY=${VUE_APP_GEMINI_API_KEY}
      - VUE_APP_ENABLE_AI_ASSISTANT=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/.n8n/workflows
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: n8n-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  n8n_data:
  redis_data:

networks:
  default:
    name: n8n-network
